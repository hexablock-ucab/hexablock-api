# Monthly dependency updates, grouped into one pull request per ecosystem.
# Each update is a normal PR: it runs CI and needs a review.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-updates:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-updates:
        patterns: ["*"]
    commit-message:
      prefix: ci
